# GitHub Actions가 빌드할 펌웨어 목록
# (템플릿의 config/west.yml이 ZMK v0.3 기준이라 보드 이름은 nice_nano_v2)
---
include:
  # 오른쪽 = 마스터(central). PC와 연결되는 쪽
  - board: nice_nano_v2
    shield: mysplit_right
  # 왼쪽 = 슬레이브(peripheral)
  - board: nice_nano_v2
    shield: mysplit_left
  # 숫자패드 = 슬레이브2(peripheral)
  - board: nice_nano_v2
    shield: mysplit_numpad
  # 페어링 초기화용 (처음 한 번, 또는 연결이 꼬였을 때)
  - board: nice_nano_v2
    shield: settings_reset
